name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  smoke:
    name: Browser smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test the site exactly as it will be published
        run: |
          npm run build
          bash scripts/assemble-site.sh _site
          SITE_DIR=_site node tests/smoke.mjs

  market-data:
    name: ECB market data (download and validate)
    runs-on: ubuntu-latest
    # The ECB being down should not turn a code change red; the job still shows as failed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/market-data.mjs --check

  release-build:
    name: Release packaging (dry run)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build
      # Downloads the bundled libraries and checks their integrity hashes, as a real release does.
      - run: bash scripts/build-release.sh "ci-${GITHUB_SHA::7}"
      - run: cd dist && sha256sum -c SHA256SUMS.txt
