name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Every business day after the ECB publishes its reference rates (about 16:00 CET), so the site
  # carries fresh market data. GitHub pauses schedules after 60 days without repository activity.
  schedule:
    - cron: '35 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build Tailwind stylesheet and run tests
        run: |
          npm ci
          npm test
          npm run build
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Fetch ECB market data
        # A failed or implausible download never replaces good data: keep the file already published.
        run: |
          if node scripts/market-data.mjs data/market.json; then
            echo "Fresh ECB data"
          else
            echo "::warning::ECB download failed or did not validate; keeping the published file"
            mkdir -p data
            curl -fsSL "${{ steps.pages.outputs.base_url }}/data/market.json" -o data/market.json || echo "::warning::No previously published market data either"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
