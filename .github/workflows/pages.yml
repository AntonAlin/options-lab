name: Deploy to Cloudflare Pages

# The site is served by Cloudflare Pages behind a Cloudflare Access login (docs/CLOUDFLARE.md).
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID, and optionally the variables CLOUDFLARE_PAGES_PROJECT (default options-lab)
# and SITE_URL (a custom domain, e.g. https://nexus.example.com).
# It never deploys a site that answers without a login: Access is checked before and after the deploy.

on:
  push:
    branches: [main]
  # Every business day after the ECB publishes its reference rates (about 16:00 CET), so the site
  # carries fresh market data.
  schedule:
    - cron: '35 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'options-lab' }}
  SITE_URL: ${{ vars.SITE_URL }}
  # Run through npx at a fixed version; there is no package.json dependency to pin it in.
  WRANGLER: wrangler@4.151.3

jobs:
  deploy:
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: ${{ vars.SITE_URL || format('https://{0}.pages.dev', vars.CLOUDFLARE_PAGES_PROJECT || 'options-lab') }}
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.market.outputs.fresh }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run tests
        run: npm test
      - name: Check the Cloudflare settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing; see docs/CLOUDFLARE.md"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is missing; see docs/CLOUDFLARE.md"; exit 1; }
          [[ "$PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}$ ]] || { echo "::error::CLOUDFLARE_PAGES_PROJECT must be lower-case letters, digits and dashes: $PROJECT"; exit 1; }
      - name: Fetch ECB and Riksbank market data
        id: market
        # A failed or implausible download never replaces good data: keep the last good file, taken from
        # the market-data archive branch (the published site is behind a login, so it cannot be read here).
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The default shell runs with pipefail, so the pipe fails when the script does.
          if node scripts/market-data.mjs data/market.json 2>&1 | tee market.log; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ECB download failed or did not validate; keeping the last archived file"
            mkdir -p data
            LATEST=$(gh api "repos/$GH_REPO/git/trees/market-data?recursive=1" \
              --jq '[.tree[].path | select(test("^[0-9]{4}/[0-9]{4}-[0-9]{2}-[0-9]{2}\\.json$"))] | sort | last // empty' || true)
            if [ -n "$LATEST" ] && gh api -H "Accept: application/vnd.github.raw" "repos/$GH_REPO/contents/$LATEST?ref=market-data" > data/market.json; then
              echo "Using archived market data $LATEST"
            else
              rm -f data/market.json
              echo "::warning::No archived market data either"
            fi
          fi
      - name: Keep the market data for the archive and the alert
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: market-data
          path: |
            data/market.json
            market.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble the site
        # Only what the site serves: no node_modules, tests, build tooling or workflows.
        run: bash scripts/assemble-site.sh _site
      - name: Require the Cloudflare Access login before deploying
        # pages.dev is always checked: with a custom domain it would otherwise be a way around the login.
        run: bash scripts/check-access.sh "https://$PROJECT.pages.dev" ${SITE_URL:+"$SITE_URL"}
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Create the project on the first run; an existing project makes this fail harmlessly.
          npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch main >/dev/null 2>&1 || true
          npx --yes "$WRANGLER" pages deploy _site --project-name "$PROJECT" --branch main \
            --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Check the login again after the deploy
        run: bash scripts/check-access.sh "https://$PROJECT.pages.dev" ${SITE_URL:+"$SITE_URL"}

  # A failed download used to be a warning nobody read. Open an issue (or comment on the open one) when
  # it fails, close it when the data is fresh again.
  alert:
    needs: deploy
    # On a push, only when the download itself ran (a failing test there is CI's business, not this issue's).
    if: always() && (github.event_name != 'push' || needs.deploy.outputs.fresh != '')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FRESH: ${{ needs.deploy.outputs.fresh }}
      DEPLOY: ${{ needs.deploy.result }}
    steps:
      - name: Open, update or close the market data issue
        run: |
          TITLE="Market data: daily download failing"
          gh label create market-data --color FBCA04 --description "ECB / Riksbank market data download" 2>/dev/null || true
          OPEN=$(gh issue list --label market-data --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$FRESH" = "true" ] && [ "$DEPLOY" = "success" ]; then
            if [ -n "$OPEN" ]; then gh issue close "$OPEN" --comment "Fresh ECB data published again: $RUN_URL"; fi
            exit 0
          fi
          MSG="The scheduled deploy on $(date -u +%F) did not publish fresh market data (download: ${FRESH:-not reached}, deploy: $DEPLOY). The site keeps serving the last good file, so FX rates and curves get older every business day this stays open. Log: $RUN_URL"
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$MSG"
          else
            gh issue create --title "$TITLE" --label market-data --body "$MSG

          Check the ECB and Riksbank endpoints in \`js/marketdata.js\` and run \`node scripts/market-data.mjs --check --strict\` locally. This issue closes itself after the next successful download."
          fi

  # One file per ECB business day on the market-data branch, so anyone can later see exactly which
  # rates and curves the site served on a given date.
  archive:
    needs: deploy
    if: needs.deploy.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: market-data
          path: ${{ runner.temp }}/md
      - name: Commit the day's file to the market-data branch
        env:
          MD: ${{ runner.temp }}/md/data/market.json
        run: |
          DAY=$(node -p "JSON.parse(require('fs').readFileSync(process.env.MD, 'utf8')).fx.dates.at(-1)")
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::no ECB date in market.json: $DAY"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin market-data >/dev/null; then
            git fetch --depth=1 origin market-data
            git switch -c market-data FETCH_HEAD
          else
            git switch --orphan market-data
            printf '%s\n' "# Market data archive" "" \
              "One file per ECB business day: \`YYYY/YYYY-MM-DD.json\`, the exact \`data/market.json\` the site served after that day's" \
              "download (ECB reference rates, euro curve, €STR and, when available, the Riksbank curve). Written by" \
              "\`.github/workflows/pages.yml\`; the file name is the newest ECB date in the file. Never edited by hand." > README.md
          fi
          mkdir -p "${DAY:0:4}"
          cp "$MD" "${DAY:0:4}/$DAY.json"
          git add -A
          if git diff --cached --quiet; then echo "Already archived: $DAY"; exit 0; fi
          git commit -m "Market data $DAY"
          git push origin market-data

  # GitHub disables scheduled workflows after 60 days without repository activity, which would stop
  # the daily market data silently. Re-enabling them through the API on every run resets that clock.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          for wf in pages.yml codeql.yml scorecard.yml regulatory-watch.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || echo "::warning::could not re-enable $wf"
          done
