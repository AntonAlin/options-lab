name: Release

# Push a tag such as v1.0.0 to publish a release, or start it by hand (Actions → Release → Run
# workflow, on main, with the version): it then checks that the starter is a repository admin (the
# same people the release-tag ruleset lets create v* tags), that the version is new and matches
# package.json, builds and tests everything, and only then creates the tag on the commit it built
# and publishes. Both zips get a signed build provenance
# attestation and a signed SBOM attestation, so anyone can verify they were built here from that tag:
#   gh attestation verify nexus-portfolio-lab-v1.0.0-offline.zip --repo AntonAlin/options-lab
#   gh attestation verify nexus-portfolio-lab-v1.0.0-offline.zip --repo AntonAlin/options-lab --predicate-type https://cyclonedx.org/bom
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.0.0 (must match package.json; the tag is created on main)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The tag being released: the pushed tag, or the version typed in when started by hand.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check a release started by hand
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Start the release from main, not $GITHUB_REF"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like v1.2.3, got '$TAG'"; exit 1; }
          PKG="v$(node -p "require('./package.json').version")"
          [[ "$TAG" == "$PKG" ]] || { echo "::error::Version $TAG does not match package.json ($PKG)"; exit 1; }
          PERM=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)
          [[ "$PERM" == "admin" ]] || { echo "::error::Only repository admins may release ($GITHUB_ACTOR has $PERM)"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then echo "::error::Tag $TAG already exists; release tags are never moved"; exit 1; fi
          echo "Releasing $TAG from $GITHUB_SHA, started by $GITHUB_ACTOR"
      - run: npm test
      - name: Snapshot of the ECB market data
        run: node scripts/market-data.mjs data/market.json || echo "::warning::ECB data not included in this release"
      # Also writes the SBOM and the calculation validation report (VALIDATION.md).
      - run: bash scripts/build-release.sh "${TAG}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.zip'
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: 'dist/*.zip'
          sbom-path: dist/nexus-portfolio-lab-${{ env.TAG }}.cdx.json
      # Started by hand: the tag is created only now, after tests, build and attestations passed, on
      # the exact commit that was built. A tag pushed by the workflow's own token starts no second run.
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OBJ=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="Nexus Portfolio Lab $TAG" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$OBJ" >/dev/null
          echo "Created tag $TAG on $GITHUB_SHA"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Works whether the tag was pushed from git or created with a release on github.com.
        # --generate-notes appends the merged PRs, grouped by label as set in .github/release.yml
        # (calculation changes, regulatory, security, ...).
        run: |
          FILES=(dist/*.zip dist/*.cdx.json dist/VALIDATION.md dist/MANUAL.txt dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "Nexus Portfolio Lab $TAG" --notes-file dist/RELEASE_NOTES.md --generate-notes --verify-tag
          fi
