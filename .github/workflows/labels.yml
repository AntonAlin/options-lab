name: Labels

# Creates or updates the labels in .github/labels.json. The labeler, the release notes categories,
# Dependabot and the market data alert rely on them.
on:
  push:
    branches: [main]
    paths: ['.github/labels.json', '.github/workflows/labels.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r l; do
            gh label create "$(jq -r .name <<<"$l")" --color "$(jq -r .color <<<"$l")" --description "$(jq -r .description <<<"$l")" --force
          done
