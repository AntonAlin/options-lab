name: Bug report
description: Something is calculated or shown wrong, or does not work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real holdings, client names or fund data here — this repository is public.** Describe the problem with made-up numbers, or use the demo portfolio.
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: e.g. Risk, Compliance, Bulk upload
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For a number that looks wrong, give the instrument type and the made-up inputs that reproduce it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Edge 129 on Windows 11
  - type: checkboxes
    id: privacy
    attributes:
      label: Data
      options:
        - label: This report contains no real portfolio or client data.
          required: true
