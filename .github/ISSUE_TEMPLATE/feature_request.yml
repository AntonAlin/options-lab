name: Suggestion
description: An instrument, check, report or improvement you would use.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        No real holdings or client data, please — the repository is public.
  - type: textarea
    id: need
    attributes:
      label: What do you need to do, and how do you do it today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options: [Portfolio manager, Risk, Compliance, Operations / NAV, IT, Other]
