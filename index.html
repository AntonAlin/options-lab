  <script>
    // Resolve the theme before first paint so dark-mode users do not get a white flash.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('nexus_portfolio_lab_v1') || '{}').settings || {};
        var pref = s.theme || 'auto';
        var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (pref !== 'auto') document.documentElement.dataset.theme = pref;
        document.documentElement.dataset.resolvedTheme = dark ? 'dark' : 'light';
        if (s.lang === 'sv') document.documentElement.lang = 'sv';
      } catch (e) { /* storage blocked — defaults are fine */ }
    })();
  </script>
  <script id="plotlyScript" src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js" integrity="sha384-cCVCZkAjYNxaYKbM8lsArLznDF/SvMFr1jcZrvOpSTCa0W40ZAdLzHCEulnUa5i7" crossorigin="anonymous" defer></script>
  <script type="module" src="js/app.js"></script>
